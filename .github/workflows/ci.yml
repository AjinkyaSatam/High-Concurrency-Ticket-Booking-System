name: TicketVerse CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build-test:
    name: Backend Build & Unit/Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile & Run JUnit 5 Test Suite
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw clean test

      - name: Build Application JAR Package
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw package -DskipTests

  frontend-build-test:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Compile Angular Production Bundle
        run: |
          cd frontend
          npm run build -- --configuration production

  docker-compose-validate:
    name: Docker Compose Syntax & Configuration Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Validate Docker Compose Config
        run: docker compose config
