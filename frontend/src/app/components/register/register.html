<div class="auth-container">
  <div class="auth-card glass-panel">
    <div class="auth-header">
      <div class="logo-badge">TV</div>
      <h2>Create Account</h2>
      <p class="subtitle">Join TicketVerse for fast, instant booking</p>
    </div>

    <div *ngIf="errorMessage" class="alert alert-error">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input 
          type="text" 
          id="fullName" 
          name="fullName" 
          [(ngModel)]="user.fullName" 
          placeholder="John Doe" 
          required 
          class="form-control"
        />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="user.email" 
          placeholder="name@example.com" 
          required 
          class="form-control"
        />
      </div>

      <div class="form-group">
        <label for="password">Password (min 6 chars)</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="user.password" 
          placeholder="••••••••" 
          required 
          class="form-control"
        />
      </div>

      <button type="submit" [disabled]="loading" class="btn btn-primary btn-full">
        <span *ngIf="!loading">Create Account</span>
        <span *ngIf="loading">Creating Account...</span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a routerLink="/login" class="link">Sign in</a></p>
      <p><a routerLink="/" class="link-muted">&larr; Back to Dashboard</a></p>
    </div>
  </div>
</div>
